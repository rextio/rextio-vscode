name: CI

on:
  push:
    branches: [main, "0.1.1"]
  pull_request:
    branches: [main, "0.1.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npm run package -- --out "$RUNNER_TEMP/rextio-vscode.vsix"

      - name: Upload VSIX
        uses: actions/upload-artifact@v6
        with:
          name: rextio-vscode-vsix
          path: ${{ runner.temp }}/rextio-vscode.vsix
          if-no-files-found: error
